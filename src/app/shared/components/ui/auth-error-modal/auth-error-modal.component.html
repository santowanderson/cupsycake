@if (isOpen()) {
  <div
    class="modal-backdrop"
    (click)="onBackdropClick($event)"
    role="dialog"
    aria-modal="true"
  >
    <div class="modal-card">
      <!-- Botão de Fechar (Topo Direito) -->
      <button class="close-btn" (click)="onClose()" aria-label="Fechar alerta">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>

      <!-- Ícone de Alerta -->
      <div class="modal-icon-wrapper">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="44"
          height="44"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      </div>

      <!-- Conteúdo da Mensagem -->
      <h3 class="modal-title">Ops! Falha no acesso</h3>
      <p class="modal-message">{{ errorMessage() }}</p>

      <!-- Ação de Cadastro -->
      <div class="modal-actions">
        <button class="btn-register" (click)="goToRegister()">
          Cadastre-se aqui
        </button>
      </div>
    </div>
  </div>
}
